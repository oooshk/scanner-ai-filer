<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Intake Login</title>
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: radial-gradient(circle at 20% 20%, #e7f1ff 0, #f7fafc 50%, #edf2f8 100%); color: #1f2a3d; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { width: min(440px, 100%); background: #fff; border: 1px solid #d6e2ef; border-radius: 12px; padding: 18px; box-shadow: 0 12px 28px rgba(23, 39, 66, 0.08); }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 12px; color: #5f6b80; }
    .msg { margin-bottom: 10px; border: 1px solid #f4b4b4; background: #fff1f1; color: #7a2323; border-radius: 8px; padding: 8px 10px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #31415f; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #cbd8e8; border-radius: 8px; padding: 10px; margin-bottom: 10px; font: inherit; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 10px; font: inherit; background: #1f6feb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Email Intake</h1>
      <p>Sign in with your scanner web account.</p>
      {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
      </form>
    </section>
  </main>
</body>
</html>
