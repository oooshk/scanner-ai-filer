paths:
  inbox: /opt/scanner-filer/inbox
  processing: /opt/scanner-filer/processing
  # Set review/archive/rejected to a NAS mount path if desired, or keep local:
  review: /opt/scanner-filer/review
  archive: /opt/scanner-filer/archive
  rejected: /opt/scanner-filer/rejected
  state: /opt/scanner-filer/state

ocr:
  enabled: true
  command: ocrmypdf
  language: eng
  skip_text: true
  rotate_pages: true
  deskew: true
  clean: false
  extra_args: ""

llm:
  enabled: true
  # Optional profile hint used by the setup UI (fast|balanced|deep|custom).
  # command_template remains the effective runtime command.
  profile: balanced
  timeout_seconds: 240
  max_input_chars: 2800
  min_confidence_autofile: 0.60
  # Primary role/mission for the classifier prompt.
  classification_descriptor: "You are an AI document filing assistant. Classify by semantic intent, not by isolated words."
  # Optional extra instructions for edge cases (for example: "MOT certificates are vehicles, never invoice")
  classification_guidance: ""
  # Allow the model to propose a new category name when no allowed type fits.
  category_suggestion_enabled: true
  # If true, a suggested category can be added automatically when confidence is high.
  auto_create_suggested_categories: false
  auto_create_min_confidence: 0.93
  # Optional backup command used automatically when JSON reliability degrades.
  fallback_command_template: ""
  # Metrics file used by the JSON reliability guard.
  json_metrics_path: /opt/scanner-filer/state/llm_json_metrics.json
  # Sliding window and thresholds for auto-fallback activation.
  json_failure_window_size: 40
  json_failure_rate_threshold: 0.35
  json_consecutive_failure_threshold: 3
  # Number of subsequent classify calls to keep fallback command active.
  json_fallback_cooldown_calls: 10
  # llama.cpp mode: keep {prompt} exactly as-is.
  # Option A – Ollama (recommended, no JSON schema flag needed):
  # command_template: ollama run qwen2.5:3b-instruct
  #
  # Option B – llama.cpp binary:
  command_template: >-
    /opt/llama.cpp/build/bin/llama-completion
    -m /opt/models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
    -n 128
    --temp 0
    --ctx-size 2048
    --json-schema '{"type":"object","required":["doc_type","vendor_or_sender","date","tags","confidence","reason"],"properties":{"doc_type":{"type":"string"},"vendor_or_sender":{"type":"string"},"date":{"type":"string"},"tags":{"type":"array","items":{"type":"string"}},"confidence":{"type":"number"},"reason":{"type":"string"}}}'
    -p "{prompt}"

splitter:
  enabled: true
  min_pages_to_split: 3
  max_first_page_chars: 700
  boundary_keywords:
    - statement
    - invoice
    - receipt
    - policy
    - council tax
    - pension
    - account number
    - patient

rules:
  allowed_doc_types:
    - council_tax
    - bank_statement
    - pension
    - utility_bill
    - insurance
    - tax
    - medical
    - payslip
    - invoice
    - receipt
    - legal
    - personal
    - unknown
  unknown_doc_type: unknown
  # Force category if phrase appears in extracted text.
  keyword_overrides: {}
  # If a document was classified as type X, but one of these keywords appears,
  # classification is downgraded to unknown for manual review.
  negative_type_keywords: {}
  # Optional category-specific confidence thresholds for auto-filing.
  per_type_min_confidence: {}

recognition:
  # OCR text budget used for keyword/phrase extraction in the UI and learning helpers.
  keyword_extract_max_chars: 5000
  # Max number of extracted keywords/phrases stored per document.
  keyword_extract_limit: 24
  # Include 2-3 word phrases in extracted terms (in addition to single words).
  keyword_extract_include_phrases: true
  # Infer move-form default year from OCR text when possible.
  infer_year_from_text: true

learning:
  # When false, manual move actions do not create/extend learned rules.
  enabled: true

public_knowledge:
  # Enable acronym/domain hint assist during classification.
  enabled: false
  # When enabled, only acronym tokens (for example: ABCP) are looked up online.
  # Full OCR/document text is never sent.
  online_lookup_enabled: false
  # Local acronym -> doc_type map (preferred over online lookup).
  acronym_overrides:
    acronym_name: pension

poll_seconds: 5
inbox_settle_seconds: 90
require_size_stability: true
stable_cycles_required: 2
# How long to keep auto-file highlight badges visible in the UI:
# 10m | 1h | 1d | 1w | forever
auto_file_highlight_window: 1h
log_level: INFO
